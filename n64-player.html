<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N64 Emulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
#game { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="game"></div>
<script>
window.coi = { shouldRegister: () => true, coepCredentialless: () => false, quiet: true };
</script>
<script src="coi-serviceworker.js"></script>
<script>
(function() {
    var params = new URLSearchParams(window.location.search);
    var romUrl = params.get('rom');
    var gameName = params.get('name') || 'N64 Game';

    if (!romUrl) {
        document.body.innerHTML = '<div style="color:#fff;text-align:center;padding:40px;font-family:sans-serif;">No ROM provided</div>';
        return;
    }

    EJS_player = '#game';
    EJS_core = 'n64';
    EJS_gameUrl = romUrl;
    EJS_gameName = gameName;
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_threads = true;
    EJS_startOnLoaded = true;
    EJS_color = '#a855f7';
    EJS_backgroundColor = '#000';
    EJS_askBeforeExit = false;
    EJS_controlScheme = 'n64';
    EJS_browserMode = 2;
    EJS_Buttons = {
        playPause: false,
        restart: true,
        mute: true,
        settings: true,
        fullscreen: true,
        saveState: true,
        loadState: true,
        screenRecord: false,
        gamepad: true,
        cheat: false,
        volume: true,
        saveSavFiles: false,
        loadSavFiles: false,
        quickSave: false,
        quickLoad: false,
        screenshot: true,
        cacheManager: false,
        exitEmulation: true
    };
    EJS_defaultControls = {
        0: {
            0: { 'value': 'x', 'value2': 'BUTTON_2' },
            1: { 'value': 's', 'value2': 'BUTTON_4' },
            2: { 'value': 'v', 'value2': 'SELECT' },
            3: { 'value': 'enter', 'value2': 'START' },
            4: { 'value': 'up arrow', 'value2': 'DPAD_UP' },
            5: { 'value': 'down arrow', 'value2': 'DPAD_DOWN' },
            6: { 'value': 'left arrow', 'value2': 'DPAD_LEFT' },
            7: { 'value': 'right arrow', 'value2': 'DPAD_RIGHT' },
            8: { 'value': 'z', 'value2': 'BUTTON_1' },
            9: { 'value': 'a', 'value2': 'BUTTON_3' },
            10: { 'value': 'q', 'value2': 'LEFT_TOP_SHOULDER' },
            11: { 'value': 'e', 'value2': 'RIGHT_TOP_SHOULDER' },
            12: { 'value': 'tab', 'value2': 'LEFT_BOTTOM_SHOULDER' },
            13: { 'value': 'r', 'value2': 'RIGHT_BOTTOM_SHOULDER' },
            14: { 'value': '', 'value2': 'LEFT_STICK' },
            15: { 'value': '', 'value2': 'RIGHT_STICK' },
            16: { 'value': 'l', 'value2': 'LEFT_STICK_X:+1' },
            17: { 'value': 'j', 'value2': 'LEFT_STICK_X:-1' },
            18: { 'value': 'k', 'value2': 'LEFT_STICK_Y:+1' },
            19: { 'value': 'i', 'value2': 'LEFT_STICK_Y:-1' },
            20: { 'value': 'n', 'value2': 'RIGHT_STICK_X:+1' },
            21: { 'value': 'b', 'value2': 'RIGHT_STICK_X:-1' },
            22: { 'value': 'm', 'value2': 'RIGHT_STICK_Y:+1' },
            23: { 'value': 'h', 'value2': 'RIGHT_STICK_Y:-1' },
            24: { 'value': '1' },
            25: { 'value': '2' },
            26: { 'value': '3' },
            27: { 'value': 'add' },
            28: { 'value': 'space' },
            29: { 'value': 'subtract' }
        }, 1: {}, 2: {}, 3: {}
    };
})();
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
